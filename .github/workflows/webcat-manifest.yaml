name: Update WEBCAT manifest.json and bundle.json

on:
  workflow_dispatch:
    # since I cannot reliably reproduce Vercel builds, I have the Vercel
    # build process generate the metadata for WEBCAT (file and CSP hashes)
    # and then fetch it from the deployment URL and integrate it
    # It's not great, because there's a time window where you deploy and WEBCAT
    # is broken until you generate the new manifest and deploy it
    # and we keep it for now a manual dispatch
    # It's also useful for testing because it can be executed on previews
    inputs:
      deployment_url:
        description: "Deployment URL (e.g. Vercel preview)"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      # 1. Fetch file-list.json and inline-scripts.json
      # generated by the Vercel build process
      - name: Fetch deployment metadata
        run: |
          set -euo pipefail
          DEPLOY="${{ github.event.inputs.deployment_url }}"

          curl -fsSL "$DEPLOY/file-list.json" -o file-list.json
          curl -fsSL "$DEPLOY/inline-scripts.json" -o inline-scripts.json

      # 2. Make a list of the CSP hashes between single quotes
      # in the future we might want to have per-page hashes
      # instead of allowing everything everywhere, but this is
      # fine for now
      - name: Extract CSP hash string
        id: hashes
        run: |
          set -euo pipefail

          HASH_STRING=$(jq -r '.[] | .[]' inline-scripts.json \
            | sort -u \
            | sed "s/^/'/; s/$/'/" \
            | tr '\n' ' ' \
            | sed 's/ $//')

          echo "hash_string=$HASH_STRING" >> "$GITHUB_OUTPUT"

      # 3. Manually build WEBCAT manifest.json
      - name: Build WEBCAT manifest
        run: |
          set -euo pipefail

          mkdir -p public/.well-known/webcat

          jq \
            --argjson files "$(cat file-list.json)" \
            --arg hashes "${{ steps.hashes.outputs.hash_string }}" \
            '
              (
                .files = $files
                | .default_csp = (
                    .default_csp
                    | gsub("\\$\\{HASHES_PLACEHOLDER\\}"; $hashes)
                  )
              )
              | { manifest: . }
            ' webcat.config.json > public/.well-known/webcat/manifest.json

          if grep -q "\${HASHES_PLACEHOLDER}" public/.well-known/webcat/manifest.json; then
            echo "CSP placeholder not replaced!"
            exit 1
          fi

      # 4. We need to serve the CSP hashes in Vercel, thus we also need
      # to replace the placeholder in the config file template
      - name: Generate vercel.json from template
        run: |
          set -euo pipefail

          jq \
            --arg hashes "${{ steps.hashes.outputs.hash_string }}" \
            '
              walk(
                if type == "string"
                then gsub("\\$\\{HASHES_PLACEHOLDER\\}"; $hashes)
                else .
                end
              )
            ' vercel.template.json > vercel.json

      # 5. Get the webcat-cli
      - name: Checkout webcat-cli
        uses: actions/checkout@v4
        with:
          repository: freedomofpress/webcat-cli
          ref: main
          path: webcat-cli

      - name: Install webcat-cli deps
        working-directory: webcat-cli
        run: npm ci

      # 6. Get an OIDC token to sign with Sigstore
      - name: Get GitHub OIDC token
        id: oidc
        run: |
          set -euo pipefail

          TOKEN="$(curl -s \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sigstore" \
            | jq -r .value)"

          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      # 7. Signe the manifest using the OIDC token and the webcat-cli
      - name: Sign manifest with Sigstore
        run: |
          set -euo pipefail

          npx tsx webcat-cli/src/cli.ts manifest sign \
            --type sigstore \
            --input "public/.well-known/webcat/manifest.json" \
            --output "public/.well-known/webcat/manifest.json" \
            --oidc-token "${{ steps.oidc.outputs.token }}"

      # 8. Assemble the bundle
      - name: Assemble WEBCAT bundle
        run: |
          set -euo pipefail

          npx tsx webcat-cli/src/cli.ts bundle create \
            -e "public/.well-known/webcat/enrollment.json" \
            -m "public/.well-known/webcat/manifest.json" \
            -o "public/.well-known/webcat/bundle.json"

      # 9. Create PR with everything
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: update signed manifest, bundle, and vercel.json"
          title: "chore: update signed manifest and bundle"
          body: |
            Auto-generated from deployment:

            - Deployment: ${{ github.event.inputs.deployment_url }}
            - file-list.json injected into manifest
            - Inline script hashes merged into CSP
            - vercel.template.json → vercel.json
            - Manifest signed via GitHub OIDC + Sigstore
            - Bundle assembled
          branch: "chore/update-webcat-manifest"
          delete-branch: false
          add-paths: |
            public/.well-known/webcat/manifest.json
            public/.well-known/webcat/bundle.json
            vercel.json